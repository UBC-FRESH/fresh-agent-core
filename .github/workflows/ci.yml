name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Deliberately independent of `test`. In ws3 the pipeline chained
  # test -> lint, which meant a single style finding skipped every downstream job
  # and a permanently-red lint gate made CI report nothing at all. Lint and tests
  # are separate signals and should be able to fail separately.
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The mcp extra is installed so mypy resolves the MCP decorators the
          # same way it does locally. Without it those decorators are untyped,
          # the narrowing `type: ignore` comments look unused, and the job fails
          # on an environment difference rather than on a real defect.
          pip install -e ".[dev,mcp]"
      - name: flake8
        run: flake8 fresh_agent_core/ tests/
      # Blocking, unlike ws3's advisory mypy step. This package starts at zero
      # findings under strict mode and should stay there.
      - name: mypy
        run: mypy fresh_agent_core/ --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      # No network access is required. If a test ever needs it, that is a design
      # problem in the test, not a reason to relax this.
      - name: Run tests
        run: pytest -v

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
