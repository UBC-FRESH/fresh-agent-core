[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fresh-agent-core"
authors = [{name = "Gregory Paradis", email = "gregory.paradis@ubc.ca"}]
dynamic = ["version", "description"]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Pinned below 2.0. The host is written against the 1.x low-level Server API
# (@server.list_tools() / @server.call_tool()), which 2.0 removed. An unbounded
# '>=1.0' let CI resolve 2.0 and fail with
# "'Server' object has no attribute 'list_tools'" -- a real incompatibility, not
# an environment quirk. Migrating to the 2.x API is tracked separately.
mcp = ["mcp>=1.0,<2"]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "flake8",
  "mypy",
  "ruff",
]

[tool.hatch.version]
# Deliberately not source = "code": that imports the module to read __version__,
# which fails during metadata generation because __init__.py re-exports from
# submodules that are not importable until the package is installed. The default
# reader scans for __version__ without executing the file.
path = "fresh_agent_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fresh_agent_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = true
check_untyped_defs = true

# Only the decorator typing is relaxed, and only for the MCP adapter. The SDK's
# decorators are untyped, which is a property of the library rather than a defect
# here.
#
# Note what is deliberately NOT disabled: attr-defined. An earlier version of this
# config suppressed it as environment noise, and it was in fact reporting a real
# incompatibility -- the 2.0 SDK genuinely lacks the attributes this module uses.
# Suppressing it hid a true failure that the runtime tests then had to catch.
[[tool.mypy.overrides]]
module = "fresh_agent_core.mcp.server"
disallow_untyped_decorators = false
disable_error_code = ["no-untyped-call"]

[tool.ruff]
line-length = 100
target-version = "py310"
