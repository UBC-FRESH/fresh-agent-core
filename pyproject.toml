[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fresh-agent-core"
authors = [{name = "Gregory Paradis", email = "gregory.paradis@ubc.ca"}]
dynamic = ["version", "description"]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "flake8",
  "mypy",
  "ruff",
]

[tool.hatch.version]
# Deliberately not source = "code": that imports the module to read __version__,
# which fails during metadata generation because __init__.py re-exports from
# submodules that are not importable until the package is installed. The default
# reader scans for __version__ without executing the file.
path = "fresh_agent_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fresh_agent_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = true
check_untyped_defs = true

# The MCP SDK's Server and decorator typings differ between releases, so pinning
# exact `type: ignore` codes here passes locally and fails on whichever version CI
# resolves -- an environment difference, not a defect. This module is a thin
# adapter with almost no logic of its own: describe_tools() and format_result()
# hold the behaviour worth checking, they are plain functions over plain data, and
# they remain strictly checked along with the rest of the package.
[[tool.mypy.overrides]]
module = "fresh_agent_core.mcp.server"
disallow_untyped_decorators = false
warn_unused_ignores = false
disable_error_code = ["attr-defined", "no-untyped-call", "misc"]

[tool.ruff]
line-length = 100
target-version = "py310"
